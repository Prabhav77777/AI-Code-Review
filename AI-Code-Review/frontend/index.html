<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Review Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>AI Code Review Assistant</h1>
        <p>Paste your code and get instant feedback.</p>

        <div class="main">

            <textarea
                id="codeInput"
                placeholder="Paste your code here..."
            ></textarea>

            <div id="output">
                Review will appear here...
            </div>

        </div>

        <button onclick="reviewCode()">
            Review Code
        </button>

        <div id="loader">
            Reviewing your code...
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
