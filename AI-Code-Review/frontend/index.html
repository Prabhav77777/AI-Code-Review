<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Review Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Code Review Assistant</h1>
        <p>Paste your code and get instant feedback.</p>

        <div class="main">

            <textarea id="codeInput" placeholder="Paste your code here..."></textarea>

            <div id="reviewContainer">

                <div class="review-box issues">
                    <h2>Issues Found</h2>
                    <ul id="issues"></ul>
                </div>

                <div class="review-box suggestions">
                    <h2>Suggestions</h2>
                    <ul id="suggestions"></ul>
                </div>

                <div class="review-box optimizedCode">
                    <h2>Optimized Code</h2>
                    <pre id="optimizedCode"></pre>
                </div>

            </div>

        </div>

        <button onclick="reviewCode()">
            Review Code
        </button>

        <div id="loader">
            Reviewing your code...
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
